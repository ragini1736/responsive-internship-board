<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternHub | Responsive Internship Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-container">
      <div class="brand">
        <span class="brand-badge">EdVyro Task</span>
        <h1>Internship Board</h1>
      </div>
      <p class="tagline">Explore and apply for verified student opportunities</p>
    </div>
  </header>

  <main class="container">
    <!-- Controls Section: Search & Filters -->
    <section class="controls-section" aria-label="Search and filter internships">
      <div class="control-group search-group">
        <label for="searchInput">Search Roles or Skills</label>
        <input 
          type="search" 
          id="searchInput" 
          placeholder="e.g. Frontend, React, Python..." 
          autocomplete="off"
        >
      </div>

      <div class="filter-row">
        <div class="control-group">
          <label for="domainFilter">Domain</label>
          <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="Frontend Development">Frontend Development</option>
            <option value="Backend Development">Backend Development</option>
            <option value="Full Stack Development">Full Stack Development</option>
            <option value="UI/UX Design">UI/UX Design</option>
            <option value="Data Analytics">Data Analytics</option>
          </select>
        </div>

        <div class="control-group">
          <label for="workModeFilter">Work Mode</label>
          <select id="workModeFilter">
            <option value="all">All Modes</option>
            <option value="Remote">Remote</option>
            <option value="Hybrid">Hybrid</option>
            <option value="On-site">On-site</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Results Status Meta -->
    <section class="results-meta" aria-live="polite">
      <span id="resultsCount">Loading opportunities...</span>
    </section>

    <!-- State Messages -->
    <div id="loadingState" class="state-box" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading internship records...</p>
    </div>

    <div id="errorState" class="state-box error-box hidden" role="alert">
      <p id="errorMessage">Unable to fetch internship data.</p>
      <button id="retryBtn" class="btn btn-secondary">Retry</button>
    </div>

    <div id="emptyState" class="state-box empty-box hidden">
      <h3>No matches found</h3>
      <p>Try tweaking your keywords or clear active filters.</p>
      <button id="resetFiltersBtn" class="btn btn-secondary">Reset Filters</button>
    </div>

    <!-- Cards Container -->
    <section 
      id="cardsGrid" 
      class="cards-grid" 
      aria-label="Internship list"
    ></section>
  </main>

  <!-- Application Modal Dialog -->
  <dialog id="applyModal" class="modal" aria-labelledby="modalTitle">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="modalTitle">Apply for Role</h2>
        <button id="closeModalBtn" class="close-btn" aria-label="Close dialog">&times;</button>
      </header>

      <form id="applyForm" novalidate>
        <input type="hidden" id="internshipId" name="internshipId">

        <div class="form-group">
          <label for="applicantName">Full Name <span class="required">*</span></label>
          <input type="text" id="applicantName" name="applicantName" required>
          <small class="field-error" id="nameError" aria-live="assertive"></small>
        </div>

        <div class="form-group">
          <label for="applicantEmail">Email Address <span class="required">*</span></label>
          <input type="email" id="applicantEmail" name="applicantEmail" placeholder="you@domain.com" required>
          <small class="field-error" id="emailError" aria-live="assertive"></small>
        </div>

        <div class="form-group">
          <label for="portfolioUrl">Portfolio or GitHub Link <span class="required">*</span></label>
          <input type="url" id="portfolioUrl" name="portfolioUrl" placeholder="https://" required>
          <small class="field-error" id="urlError" aria-live="assertive"></small>
        </div>

        <div class="form-group">
          <label for="applicantNote">Short Note / Pitch</label>
          <textarea id="applicantNote" name="applicantNote" rows="3" placeholder="Why are you a good fit?"></textarea>
        </div>

        <div id="formSuccessMessage" class="form-success hidden" role="status">
          Application submitted successfully!
        </div>

        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Submit Application</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
